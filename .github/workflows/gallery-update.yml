name: Update extension galleries

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-galleries.mjs"
      - ".github/workflows/gallery-update.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML parser
        run: |
          rm -rf node_modules
          npm install --no-save --package-lock=false cheerio@1.0.0
      - name: Scan galleries and update JSON
        run: node scripts/update-galleries.mjs
      - name: Remove temporary dependencies
        run: rm -rf node_modules
      - name: Commit updated gallery data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.json' .github/gallery-update-state.json
          git add -u
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Automated 15-day extension gallery refresh"
            git push
          fi
